# Include this snippet inside the existing HTTP server block.
location = /fantasy-frontiers {
    return 301 /fantasy-frontiers/;
}

location ^~ /fantasy-frontiers/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /fantasy-frontiers/ {
    alias /data/workspace/fantasy-frontiers/apps/game/dist/;
    try_files $uri $uri/ /fantasy-frontiers/index.html;
}
